name: Build APK

on:
  # Every branch builds (other branches are debug-signed checks); only main publishes.
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::KEYSTORE_B64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a build with the wrong key."
              exit 1
            fi
            echo "No signing secrets: debug-signed check build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/skjalfti-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/skjalfti-release.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$KEY_ALIAS" ]; then echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; fi

      - name: Test and build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |FAILED|error:" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk skjalfti.apk

      - name: Release notes
        run: |
          {
            echo "Tap **skjalfti.apk** below on your phone to install or update."
            echo
            echo "Built from ${GITHUB_SHA}."
          } > notes.md

      - name: Publish release
        # Only main publishes; other branches are build checks.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Skjálfti 1.0.${{ github.run_number }}
          body_path: notes.md
          files: skjalfti.apk
          make_latest: true
